name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agf_drawer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Lint check
        run: npm run lint

      - name: Run Prisma migrations on test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agf_drawer_test?schema=public
        run: |
          npm run prisma:generate
          npx prisma migrate deploy
          npm run prisma:seed

      - name: Run Vitest test suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agf_drawer_test?schema=public
          NODE_ENV: test
          SESSION_SECRET: test-session-secret-must-be-long-enough-32-chars
          CSRF_SECRET: test-csrf-secret-must-be-long-enough-32-chars
          COOKIE_SECRET: test-cookie-secret-must-be-long-enough-32-chars
        run: npm test

      - name: Production build
        run: npm run build
