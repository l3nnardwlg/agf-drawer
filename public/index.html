<!doctype html><html lang="de"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AGF Drawer</title><link rel="stylesheet" href="/style.css"/></head><body><main><header><div><span class="eyebrow">AGF STUDIOS · INVENTORY</span><h1>Drawer<span class="accent">.</span></h1><p>Finde deine Kabel. Behalte deinen Bestand im Blick.</p></div><button id="new">+ Kabel erfassen</button></header><section class="stats" id="stats"></section><section class="toolbar"><input id="search" placeholder="USB-C, USB-A, grau, HDMI …" aria-label="Kabel suchen"/><select id="filter"><option value="">Alle Kabel</option><option value="stored">Eingelagert</option><option value="in_use">In Verwendung</option><option value="loaned">Verliehen</option><option value="missing">Vermisst</option></select><button class="secondary" id="new-location">+ Lagerort</button></section><div id="feedback" role="status"></div><section class="cards" id="cards"></section></main><dialog id="editor"><form id="cable-form"><h2>Neues Kabel</h2><label>Bezeichnung<input name="name" placeholder="USB-C auf USB-A" required maxlength="160"/></label><div class="two"><label>Anschluss A<input name="connector_a" list="connectors" required/></label><label>Anschluss B<input name="connector_b" list="connectors" required/></label></div><datalist id="connectors"><option value="USB-C"/><option value="USB-A"/><option value="USB-B"/><option value="Micro-USB"/><option value="Mini-USB"/><option value="Lightning"/><option value="HDMI"/><option value="Mini-HDMI"/><option value="Micro-HDMI"/><option value="DisplayPort"/><option value="Mini DisplayPort"/><option value="VGA"/><option value="DVI-D"/><option value="RJ45"/><option value="RJ11"/><option value="USB 3.0 Micro-B"/><option value="3.5mm Klinke"/><option value="6.35mm Klinke"/><option value="RCA/Cinch"/><option value="XLR 3-pin"/><option value="DC Barrel"/><option value="IEC C13"/><option value="IEC C14"/><option value="Europlug"/><option value="Schuko"/><option value="SATA"/><option value="Molex"/><option value="BNC"/><option value="TOSLINK"/><option value="SDI"/><option value="Thunderbolt 2"/><option value="Thunderbolt 3"/><option value="USB-C PD"/></datalist><div class="two"><label>Farbe<input name="color" placeholder="Grau"/></label><label>Länge (cm)<input name="length_cm" type="number" min="1" placeholder="150"/></label></div><div class="two"><label>Anzahl<input name="quantity" type="number" min="1" max="1000" value="1" required/></label><label>Status<select name="status"><option value="stored">Eingelagert</option><option value="in_use">In Verwendung</option><option value="loaned">Verliehen</option><option value="missing">Vermisst</option></select></label></div><label>Lagerort<select name="location_id" id="location-select"><option value="">Ohne Lagerort</option></select></label><label>Verwendung (optional)<input name="usage_place" placeholder="Netzwerk-Rack, Switch Port 8"/></label><label>Notizen<textarea name="notes" rows="2"></textarea></label><footer><button type="button" class="secondary" id="cancel">Abbrechen</button><button type="submit">Speichern</button></footer></form></dialog><dialog id="location-dialog"><form id="location-form"><h2>Lagerort erstellen</h2><label>Name<input name="name" placeholder="Schrank A / Schublade 2" required/></label><label>Typ<select name="kind"><option value="cabinet">Schrank</option><option value="drawer">Schublade</option><option value="shelf">Regal</option><option value="box">Box</option><option value="other">Sonstiges</option></select></label><label>Übergeordneter Ort<select name="parent_id" id="parent-select"><option value="">Keiner</option></select></label><footer><button type="button" class="secondary" id="cancel-location">Abbrechen</button><button type="submit">Anlegen</button></footer></form></dialog><script type="module" src="/app.js"></script></body></html>
